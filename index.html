<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sangen om Lea</title>
  <style>
    :root {
      --bg: #fef6e4;
      --ink: #001858;
      --accent: #f582ae;
      --soft: #8bd3dd;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    main {
      max-width: 36rem;
      width: 100%;
      background: #fff;
      border-radius: 1.25rem;
      padding: 2rem 2rem 2.5rem;
      box-shadow: 0 1rem 2rem rgba(0, 24, 88, 0.12);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      color: var(--accent);
    }
    .climb {
      position: relative;
      width: 4rem;
      height: 12rem;
      margin: 0.5rem auto 1rem;
    }
    .thread {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--ink);
      opacity: 0.25;
      transform: translateX(-50%);
    }
    .spider {
      position: absolute;
      left: 50%;
      bottom: 0;
      font-size: 3rem;
      transform: translate(-50%, 0);
      transform-origin: 50% 0;
      animation: climb 6s ease-in-out infinite, wiggle 0.6s ease-in-out infinite;
    }
    @keyframes climb {
      0%   { bottom: 0;     }
      45%  { bottom: 85%;   }
      55%  { bottom: 85%;   }
      70%  { bottom: 0;     }
      100% { bottom: 0;     }
    }
    @keyframes wiggle {
      0%, 100% { transform: translate(-50%, 0) rotate(-8deg); }
      50%      { transform: translate(-50%, 0) rotate(8deg);  }
    }
    pre.lyrics {
      font-family: inherit;
      font-size: 1.15rem;
      line-height: 1.7;
      white-space: pre-wrap;
      margin: 1rem 0 0;
      color: var(--ink);
    }
    footer {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--soft);
    }
  </style>
</head>
<body>
  <main>
    <h1>Sangen om Lea</h1>
    <div class="climb" aria-hidden="true">
      <div class="thread"></div>
      <div class="spider">🕷️</div>
    </div>
    <pre class="lyrics">Lille Lea, modig spejder,
finder vej i regn og blæst.
Hver en hund og hver en hest
ved at Lea er en ven.
Harry Potter har hun læst,
kender mod fra Gryffindor.
Lille Lea, fjorten år,
flyver højt med stav i hånd.</pre>
    <footer>Til Lea ❤️</footer>
  </main>
</body>
</html>
