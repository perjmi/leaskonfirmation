<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lille Peter Edderkop</title>
  <style>
    :root {
      --bg: #fef6e4;
      --ink: #001858;
      --accent: #f582ae;
      --soft: #8bd3dd;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    main {
      max-width: 36rem;
      width: 100%;
      background: #fff;
      border-radius: 1.25rem;
      padding: 2rem 2rem 2.5rem;
      box-shadow: 0 1rem 2rem rgba(0, 24, 88, 0.12);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      color: var(--accent);
    }
    .spider {
      font-size: 3rem;
      margin: 0.5rem 0 1rem;
      animation: sway 4s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes sway {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50%      { transform: translateY(-8px) rotate(6deg); }
    }
    pre.lyrics {
      font-family: inherit;
      font-size: 1.15rem;
      line-height: 1.7;
      white-space: pre-wrap;
      margin: 1rem 0 0;
      color: var(--ink);
    }
    footer {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--soft);
    }
  </style>
</head>
<body>
  <main>
    <h1>Lille Peter Edderkop</h1>
    <div class="spider" aria-hidden="true">🕷️</div>
    <pre class="lyrics">Lille Peter Edderkop
kravlede op ad muren.
Så kom regnen
og skyllede Peter ned.
Så kom solen
og tørrede Peters krop.
Lille Peter Edderkop
kravlede atter op.</pre>
    <footer>Til Lea ❤️</footer>
  </main>
</body>
</html>
